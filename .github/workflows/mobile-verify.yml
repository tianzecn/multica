name: Mobile Verify

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/types/**"
      - "packages/core/api/schemas.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/types/**"
      - "packages/core/api/schemas.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm --filter @multica/mobile typecheck

      - name: Lint
        run: pnpm --filter @multica/mobile lint

      - name: Test
        run: pnpm --filter @multica/mobile test
